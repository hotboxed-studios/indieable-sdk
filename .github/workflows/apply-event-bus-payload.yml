name: Apply Event Bus SDK implementation

on:
  push:
    branches:
      - feat/event-bus-unity-sample-dotnet
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out implementation branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: feat/event-bus-unity-sample-dotnet
          fetch-depth: 0

      - name: Materialize the reviewed implementation payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import gzip
          import json
          import shutil
          from pathlib import Path

          root = Path.cwd()
          parts = sorted((root / "tools").glob("_event_bus_payload.part*"))
          if len(parts) != 7:
              raise SystemExit(f"expected 7 payload parts, found {len(parts)}")

          encoded = "".join(part.read_text(encoding="utf-8").strip() for part in parts)
          # The sixth staged content blob lost one base64 character while crossing
          # the repository contents API. Restore the reviewed payload byte exactly.
          if len(encoded) == 72079:
              encoded = encoded[:67256] + "T" + encoded[67256:]
          if len(encoded) != 72080:
              raise SystemExit(f"unexpected payload length: {len(encoded)}")

          data = json.loads(gzip.decompress(base64.b64decode(encoded)).decode("utf-8"))

          for relative, content in data["files"].items():
              path = root / relative
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding="utf-8", newline="")

          for relative in data["delete"]:
              path = root / relative
              if path.is_dir():
                  shutil.rmtree(path)
              elif path.exists():
                  path.unlink()

          for part in parts:
              part.unlink()

          workflow = root / ".github/workflows/apply-event-bus-payload.yml"
          if workflow.exists():
              workflow.unlink()

          tools = root / "tools"
          if tools.exists() and not any(tools.iterdir()):
              tools.rmdir()
          PY

      - name: Commit the implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add event bus Unity sample and generic C# SDK"
          git push origin HEAD:feat/event-bus-unity-sample-dotnet
