name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-event-bus-sample:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/event-bus-unity-sample-dotnet'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out the pull-request branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Require the authored bridge reference instead of runtime lookup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("Samples~/EventBusIntegration/Scripts/IndieableEventBusSampleController.cs")
          text = path.read_text(encoding="utf-8")
          old = '''            if (eventBusBridge == null)
                eventBusBridge = GetComponent<IndieableEventBusBridge>();
'''
          new = '''            if (eventBusBridge == null)
            {
                Debug.LogWarning(
                    "[Indieable Sample] The authored scene is missing its " +
                    "IndieableEventBusBridge reference.");
                enabled = false;
                return;
            }
'''
          if old not in text:
              print("Controller already uses the authored reference guard.")
              raise SystemExit(0)
          path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="")
          PY

      - name: Commit the controller fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Samples~/EventBusIntegration/Scripts/IndieableEventBusSampleController.cs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: require the authored Event Bus bridge reference"
          git push origin HEAD:${{ github.head_ref }}

  validate-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out complete history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"

      - name: Validate Python tooling
        run: python -m compileall -q scripts

      - name: Scan the tree and Git history for secrets
        run: python scripts/scan_secrets.py --history

      - name: Validate the Unity package
        run: python scripts/validate_package.py

      - name: Validate the Unity sample and generic C# SDK
        run: python scripts/validate_examples.py

      - name: Compile the Unity runtime and imported sample scripts
        run: dotnet build ci~/CompileCheck/CompileCheck.csproj --configuration Release

      - name: Build the generic C# SDK
        run: dotnet build DotNet/Indieable.Sdk/Indieable.Sdk.csproj --configuration Release

      - name: Run generic C# and event-bus smoke
        run: dotnet run --project ci~/CoreSmoke/CoreSmoke.csproj --configuration Release

      - name: Build Stable-form Unity and generic C# artifacts
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import json; print(json.load(open("package.json", encoding="utf-8"))["version"])')"
          python scripts/package.py --channel stable --output dist
          dotnet pack DotNet/Indieable.Sdk/Indieable.Sdk.csproj \
            --configuration Release \
            --output dist \
            -p:PackageVersion="${VERSION}"

      - name: Upload SDK artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: indieable-sdk-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
