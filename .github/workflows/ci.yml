name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out complete history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"

      - name: Validate Python tooling
        run: python -m compileall -q scripts

      - name: Scan the tree and Git history for secrets
        run: python scripts/scan_secrets.py --history

      - name: Validate the Unity package
        run: python scripts/validate_package.py

      - name: Validate the Unity sample and generic C# SDK
        run: python scripts/validate_examples.py

      - name: Compile the Unity runtime and imported sample scripts
        run: dotnet build ci~/CompileCheck/CompileCheck.csproj --configuration Release

      - name: Build the generic C# SDK
        run: dotnet build DotNet/Indieable.Sdk/Indieable.Sdk.csproj --configuration Release

      - name: Run generic C# and event-bus smoke
        run: dotnet run --project ci~/CoreSmoke/CoreSmoke.csproj --configuration Release

      - name: Build Stable-form Unity and generic C# artifacts
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import json; print(json.load(open("package.json", encoding="utf-8"))["version"])')"
          python scripts/package.py --channel stable --output dist
          dotnet pack DotNet/Indieable.Sdk/Indieable.Sdk.csproj \
            --configuration Release \
            --output dist \
            -p:PackageVersion="${VERSION}"

      - name: Upload SDK artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: indieable-sdk-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
