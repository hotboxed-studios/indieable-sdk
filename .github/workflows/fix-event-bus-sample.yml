name: Fix Event Bus sample controller

on:
  push:
    branches:
      - feat/event-bus-unity-sample-dotnet
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: feat/event-bus-unity-sample-dotnet
          fetch-depth: 0
      - name: Replace compile-only GetComponent fallback with an authored-scene guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("Samples~/EventBusIntegration/Scripts/IndieableEventBusSampleController.cs")
          text = path.read_text(encoding="utf-8")
          old = '''            if (eventBusBridge == null)
                eventBusBridge = GetComponent<IndieableEventBusBridge>();
'''
          new = '''            if (eventBusBridge == null)
            {
                Debug.LogWarning(
                    "[Indieable Sample] The authored scene is missing its " +
                    "IndieableEventBusBridge reference.");
                enabled = false;
                return;
            }
'''
          if old not in text:
              print("Controller is already fixed.")
              raise SystemExit(0)
          path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="")
          PY
      - name: Commit the controller fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Samples~/EventBusIntegration/Scripts/IndieableEventBusSampleController.cs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: require the authored Event Bus bridge reference"
          git push origin HEAD:feat/event-bus-unity-sample-dotnet
