name: Nightly

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: indieable-sdk-nightly
  cancel-in-progress: true

jobs:
  build-nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Require main branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Nightly publication is restricted to main; received ${GITHUB_REF}" >&2
            exit 1
          fi

      - name: Check out complete history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"

      - name: Determine Nightly version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          BASE_VERSION="$(python -c 'import json; print(json.load(open("package.json", encoding="utf-8"))["version"])')"
          VERSION="${BASE_VERSION}-nightly.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Scan the tree and Git history for secrets
        run: python scripts/scan_secrets.py --history

      - name: Validate the Unity package
        run: python scripts/validate_package.py

      - name: Compile the public C# surface
        run: dotnet build ci~/CompileCheck/CompileCheck.csproj --configuration Release

      - name: Build Nightly package
        run: >-
          python scripts/package.py
          --channel nightly
          --version "${{ steps.version.outputs.version }}"
          --output dist

      - name: Upload Nightly workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: indieable-sdk-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling Nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          cat > nightly-notes.md <<EOF
          # Indieable SDK Nightly ${NIGHTLY_VERSION}

          Built from commit \`${GITHUB_SHA}\` on the \`main\` branch.

          Nightly is an explicit opt-in integration build. It may change without
          migration support and still requires a real Unity import and Play Mode test.

          The release archive is produced from the public package allowlist after a
          full-history secret scan, package validation, and C# compile check.
          EOF

          gh release delete nightly --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create nightly dist/* \
            --target "${GITHUB_SHA}" \
            --title "Indieable SDK Nightly ${NIGHTLY_VERSION}" \
            --notes-file nightly-notes.md \
            --prerelease
