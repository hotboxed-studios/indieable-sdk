name: Nightly

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: indieable-sdk-nightly
  cancel-in-progress: true

jobs:
  build-nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Require main branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Nightly publication is restricted to main; received ${GITHUB_REF}" >&2
            exit 1
          fi

      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Determine Nightly version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          BASE_VERSION="$(python -c 'import json; print(json.load(open("package.json", encoding="utf-8"))["version"])')"
          VERSION="${BASE_VERSION}-nightly.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Scan the tree and Git history for secrets
        run: python scripts/scan_secrets.py --history

      - name: Validate Unity and generic C# packages
        run: |
          python scripts/validate_package.py
          python scripts/validate_examples.py

      - name: Compile Unity runtime and sample
        run: dotnet build ci~/CompileCheck/CompileCheck.csproj --configuration Release

      - name: Build and smoke-test generic C# SDK
        run: |
          dotnet build DotNet/Indieable.Sdk/Indieable.Sdk.csproj --configuration Release
          dotnet run --project ci~/CoreSmoke/CoreSmoke.csproj --configuration Release

      - name: Build Nightly Unity and generic C# artifacts
        run: |
          python scripts/package.py \
            --channel nightly \
            --version "${{ steps.version.outputs.version }}" \
            --output dist
          dotnet pack DotNet/Indieable.Sdk/Indieable.Sdk.csproj \
            --configuration Release \
            --output dist \
            -p:PackageVersion="${{ steps.version.outputs.version }}"

      - name: Upload Nightly workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: indieable-sdk-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling Nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          cat > nightly-notes.md <<EOF
          # Indieable SDK Nightly ${NIGHTLY_VERSION}

          Built from commit \`${GITHUB_SHA}\` on the \`main\` branch.

          Assets include:

          - the Unity Package Manager tarball and checksum/metadata;
          - the generic .NET 8 \`Indieable.Sdk\` NuGet package.

          Import the Unity **Event Bus Integration** sample from Package Manager to
          test the scene, GameObjects, UI Toolkit permission popup, typed local
          events, routing asset, and Indieable bridge.

          Nightly is explicit opt-in and may change without migration support. Real
          Unity import, Play Mode, and Preview acceptance remain required before
          Stable publication.
          EOF

          gh release delete nightly --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create nightly dist/* \
            --target "${GITHUB_SHA}" \
            --title "Indieable SDK Nightly ${NIGHTLY_VERSION}" \
            --notes-file nightly-notes.md \
            --prerelease
