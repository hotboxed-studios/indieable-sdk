name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Stable version from package.json, without the v prefix"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: indieable-sdk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Validate release version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${REQUESTED_VERSION}"
            TAG="v${VERSION}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          fi

          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Stable releases require X.Y.Z; received ${VERSION}" >&2
            exit 1
          fi

          MANIFEST_VERSION="$(python -c 'import json; print(json.load(open("package.json", encoding="utf-8"))["version"])')"
          if [[ "${VERSION}" != "${MANIFEST_VERSION}" ]]; then
            echo "Tag/input ${VERSION} does not match package.json ${MANIFEST_VERSION}" >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Scan the tree and Git history for secrets
        run: python scripts/scan_secrets.py --history

      - name: Validate the Unity package
        run: python scripts/validate_package.py

      - name: Compile the public C# surface
        run: dotnet build ci/CompileCheck/CompileCheck.csproj --configuration Release

      - name: Build Stable package
        run: python scripts/package.py --channel stable --output dist

      - name: Upload release workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: indieable-sdk-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish Stable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/* --clobber
          else
            gh release create "${RELEASE_TAG}" dist/* \
              --target "${GITHUB_SHA}" \
              --title "Indieable SDK ${RELEASE_VERSION}" \
              --generate-notes
          fi
