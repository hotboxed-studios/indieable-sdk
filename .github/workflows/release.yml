name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Stable version from package.json, without the v prefix"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: indieable-sdk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out complete history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Validate release version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
              echo "Manual Stable publication is restricted to main; received ${GITHUB_REF}" >&2
              exit 1
            fi
            VERSION="${REQUESTED_VERSION}"
            TAG="v${VERSION}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          fi
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Stable releases require X.Y.Z; received ${VERSION}" >&2
            exit 1
          fi
          MANIFEST_VERSION="$(python -c 'import json; print(json.load(open("package.json", encoding="utf-8"))["version"])')"
          if [[ "${VERSION}" != "${MANIFEST_VERSION}" ]]; then
            echo "Tag/input ${VERSION} does not match package.json ${MANIFEST_VERSION}" >&2
            exit 1
          fi
          DOTNET_VERSION="$(python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("DotNet/Indieable.Sdk/Indieable.Sdk.csproj").getroot()
          value = root.findtext(".//Version")
          print(value or "")
          PY
          )"
          if [[ "${DOTNET_VERSION}" != "${VERSION}" ]]; then
            echo "Generic C# package ${DOTNET_VERSION} does not match ${VERSION}" >&2
            exit 1
          fi
          if git show-ref --tags --verify --quiet "refs/tags/${TAG}"; then
            TAG_SHA="$(git rev-list -n 1 "${TAG}")"
            if [[ "${TAG_SHA}" != "${GITHUB_SHA}" ]]; then
              echo "Existing tag ${TAG} points to ${TAG_SHA}, not ${GITHUB_SHA}; refusing to move it" >&2
              exit 1
            fi
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Refuse to overwrite an existing Stable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Stable release ${RELEASE_TAG} already exists and is immutable." >&2
            exit 1
          fi

      - name: Scan the tree and Git history for secrets
        run: python scripts/scan_secrets.py --history

      - name: Validate Unity and generic C# packages
        run: |
          python scripts/validate_package.py
          python scripts/validate_examples.py

      - name: Compile Unity runtime and sample
        run: dotnet build ci~/CompileCheck/CompileCheck.csproj --configuration Release

      - name: Build and smoke-test generic C# SDK
        run: |
          dotnet build DotNet/Indieable.Sdk/Indieable.Sdk.csproj --configuration Release
          dotnet run --project ci~/CoreSmoke/CoreSmoke.csproj --configuration Release

      - name: Build Stable Unity and generic C# artifacts
        run: |
          python scripts/package.py --channel stable --output dist
          dotnet pack DotNet/Indieable.Sdk/Indieable.Sdk.csproj \
            --configuration Release \
            --output dist \
            -p:PackageVersion="${{ steps.version.outputs.version }}"

      - name: Upload release workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: indieable-sdk-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish Stable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" dist/* \
            --target "${GITHUB_SHA}" \
            --title "Indieable SDK ${RELEASE_VERSION}" \
            --generate-notes
